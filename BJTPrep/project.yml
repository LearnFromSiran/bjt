name: BJTPrep
options:
  bundleIdPrefix: app.bjtprep
  deploymentTarget:
    iOS: "16.0"
targets:
  BJTPrep:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: BJT Prep
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bjtprep.BJTPrep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
